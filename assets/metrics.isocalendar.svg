<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution calendar placeholder</title>
  <desc id="desc">This image is regenerated by the Metrics GitHub Actions workflow.</desc>
  <rect width="920" height="260" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="918" height="258" rx="13" fill="none" stroke="#30363d"/>
  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="40" y="78" fill="#39d353" font-size="20" font-weight="700">Contribution calendar</text>
    <text x="40" y="112" fill="#8b949e" font-size="14">GitHub Actions will replace this file with your live isometric calendar.</text>
    <text x="40" y="144" fill="#8b949e" font-size="13">Run the Metrics workflow once after pushing and adding METRICS_TOKEN.</text>
  </g>
  <g transform="translate(40 178)">
    <rect width="16" height="16" rx="3" fill="#0e4429"/>
    <rect x="24" width="16" height="16" rx="3" fill="#006d32"/>
    <rect x="48" width="16" height="16" rx="3" fill="#26a641"/>
    <rect x="72" width="16" height="16" rx="3" fill="#39d353"/>
  </g>
</svg>
